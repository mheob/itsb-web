allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  sharp: true

overrides:
  path-to-regexp: ^6.3.0
  # Optional dependency that routing-utils never loads at runtime; pulls in the unmaintained uri-js.
  "@vercel/routing-utils>ajv": "-"
  # @vercel/cli-config pins zod 4.1.11, which is affected by CVE-2023-54404 (fixed in 4.6.6).
  "@vercel/cli-config>zod": ^4.6.6
  vite@*: "catalog:"

packageExtensions:
  # astro2tsx pins @emnapi/core 1.11.3 but not the matching runtime, so pnpm fills the runtime peer
  # with the 2.0.0-beta.2 of rolldown's wasm binding and `astro check` fails to load @astrojs/check.
  # Remove once astro2tsx depends on @emnapi/runtime: https://github.com/withastro/astro/issues/18642
  "@astrojs/astro2tsx":
    dependencies:
      "@emnapi/runtime": 1.11.3
  # @vercel/analytics lists nuxt as a peer without marking it optional, so it gets auto-installed.
  "@vercel/analytics":
    peerDependenciesMeta:
      nuxt:
        optional: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
