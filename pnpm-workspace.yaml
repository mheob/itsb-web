allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  sharp: true

overrides:
  path-to-regexp: ^6.3.0
  # Optional dependency that routing-utils never loads at runtime; pulls in the unmaintained uri-js.
  "@vercel/routing-utils>ajv": "-"
  # @vercel/cli-config pins zod 4.1.11, which is affected by CVE-2023-54404 (fixed in 4.6.6).
  "@vercel/cli-config>zod": ^4.6.6
  vite@*: "catalog:"

packageExtensions:
  # @vercel/analytics lists nuxt as a peer without marking it optional, so it gets auto-installed.
  "@vercel/analytics":
    peerDependenciesMeta:
      nuxt:
        optional: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
