allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  sharp: true

overrides:
  path-to-regexp: ^6.3.0
  # Optional dependency that routing-utils never loads at runtime; pulls in the unmaintained uri-js.
  "@vercel/routing-utils>ajv": "-"
  vite@*: "catalog:"

packageExtensions:
  # @vercel/analytics lists nuxt as a peer without marking it optional, so it gets auto-installed.
  "@vercel/analytics":
    peerDependenciesMeta:
      nuxt:
        optional: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
# Written by pnpm when 4.1.3 was installed on its release day. Remove it after 2026-11-20.
minimumReleaseAgeExclude:
  - "@mheob/oxlint-config@4.1.3"
